
name: 打包 EXE 和 DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装打包依赖
        run: pip install pyinstaller
      - name: 打包 EXE
        run: pyinstaller --onefile --windowed --icon win/icon.ico --name GoogleLoginWin win/google_login_win.py
      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/GoogleLoginWin.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译并自测
        run: bash mac/source/build.sh
      - name: 制作 DMG
        run: |
          mkdir -p dist
          hdiutil create -volname "Google 登录助手" -srcfolder "mac/Google 登录助手.app" -ov -format UDZO "dist/GoogleLoginMac.dmg"
      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/GoogleLoginMac.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 发布最新版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版
          body: |
            Windows 用户下载 GoogleLoginWin.exe，双击即可运行（需本机安装 Google Chrome；Python 已打包在内，无需安装）。
            Mac 用户下载 GoogleLoginMac.dmg，打开后把「Google 登录助手」拖到应用程序文件夹。

            注意（未签名应用）：
            - Windows 首次运行若出现 SmartScreen 提示，点「更多信息」→「仍要运行」。
            - Mac 首次打开若被拦截，右键点击应用 →「打开」即可。
          files: |
            artifacts/windows-exe/GoogleLoginWin.exe
            artifacts/macos-dmg/GoogleLoginMac.dmg
